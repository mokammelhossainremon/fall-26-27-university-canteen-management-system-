<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add canteen food items to your cart">
    <meta name="author" content="rimon">
    <title>Add To Cart | CampusBite</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>

<body id="top">

    <header>
        <span class="brand">CampusBite</span>
        <em>University Canteen Management System</em>
    </header>

    <nav>

        <a class="nav-link" href="viewMenu.html" title="See the food menu">View Menu</a> |
        <a class="nav-link" href="searchFood.html" title="Search food">Search Food</a> |
        <a class="nav-link" href="addToCart.html" title="Add food to cart">Add To Cart</a> |
        <a class="nav-link" href="placeOrder.html" title="Place your order">Place Order</a> |
        <a class="nav-link" href="orderHistory.html" title="Your previous orders">Order History</a> |
        <a class="nav-link" href="login.html" title="Logout">Logout</a>
    </nav>

    <main>
        <section class="card">
            <figure>
                <img src="images/cart.jpeg" alt="Add To Cart" width="80" height="80" title="Cart">
            </figure>
            <h2>Add To Cart</h2>

            <form action="#" method="post" onsubmit="return addToCart()">
                <fieldset>
                    <legend>Cart Item</legend>
                    <label for="foodname">Food Name:</label><br>
                    <select id="foodname" name="foodname" class="field" required>
                        <option value="" disabled selected>Select Food</option>
                        <option value="Chicken Burger">Chicken Burger</option>
                        <option value="Pizza">Pizza</option>
                        <option value="French Fries">French Fries</option>
                        <option value="Tea">Tea</option>
                        <option value="Fried Rice">Fried Rice</option>
                    </select><br><br>

                    <label for="foodid">Food ID:</label><br>
                    <input type="text" id="foodid" name="foodid" class="field" placeholder="F001" pattern="F[0-9]{3}"
                        title="Format F001" required><br><br>

                    <label for="quantity">Quantity:</label><br>
                    <input type="number" id="quantity" name="quantity" class="field" min="1" max="20" step="1" value="1"
                        required><br><br>

                    <label for="price">Price (Tk):</label><br>
                    <input type="number" id="price" name="price" class="field" min="5" step="5" required><br><br>

                    <label for="instructions">Special Instructions:</label><br>
                    <textarea id="instructions" name="instructions" class="field" rows="4" cols="30" maxlength="200"
                        placeholder="Example: less spicy"></textarea><br><br>

                    <input type="submit" value="Add To Cart" class="btn">
                    <input type="reset" value="Clear" class="btn btn-reset">
                </fieldset>
            </form>
            <p class="center"><a href="placeOrder.html">Go to Place Order</a></p>
        </section>
    </main>

    <footer>
        <p>Copyright &copy; 2026 CampusBite. All Rights Reserved.</p>
        <p>University Canteen Management System</p>
        <p><a class="nav-link" href="#top">Back to top</a></p>
    </footer>

    <script src="JS/addToCart.js"></script>

</body>

</html>
